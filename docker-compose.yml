name: laverie-nails

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-fpm
    image: laverie-nails/php-fpm:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/data/database.sqlite
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - sqlite_data:/var/www/data
      - runtime_storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - public_uploads:/var/www/html/storage/app/public
    networks:
      - laverie
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: laverie-nails/nginx:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      php-fpm:
        condition: service_healthy
    ports:
      # Loopback only: Cloudflare Tunnel connects from the host, and the
      # origin must never be reachable directly from the internet.
      - "127.0.0.1:${APP_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
    volumes:
      - public_uploads:/var/www/html/storage/app/public:ro
    networks:
      - laverie
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    image: laverie-nails/php-fpm:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/data/database.sqlite
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - sqlite_data:/var/www/data
      - runtime_storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - public_uploads:/var/www/html/storage/app/public
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - laverie

  scheduler:
    image: laverie-nails/php-fpm:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/data/database.sqlite
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - sqlite_data:/var/www/data
      - runtime_storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - public_uploads:/var/www/html/storage/app/public
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - laverie

networks:
  laverie:
    driver: bridge

volumes:
  sqlite_data:
  runtime_storage:
  bootstrap_cache:
  public_uploads: